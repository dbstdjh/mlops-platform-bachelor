[project]
name = "mldlc-sklearn-pickle-server"
version = "0.1.0"
description = "Prebuilt FastAPI inference server for scikit-learn pickle artifacts."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklearn_pickle_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
