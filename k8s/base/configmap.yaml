apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: mldlc
data:
  POSTGRES_DB: mldlc
  POSTGRES_USER: mldlc
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: minio.mldlc.local
  MINIO_REGION: us-east-1
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_USE_SSL: "false"
  GITEA_URL: http://gitea:3000
  GITEA_PUBLIC_URL: http://gitea.mldlc.local:80
  GRAFANA_URL: http://grafana:3000
  GRAFANA_PUBLIC_URL: http://grafana.mldlc.local
  GRAFANA_DATASOURCE_NAME: mldlc-postgres
  GRAFANA_DATASOURCE_HOST: db
  GRAFANA_DATASOURCE_PORT: "5432"
  GRAFANA_DATASOURCE_DATABASE: mldlc
  GRAFANA_DATASOURCE_USER: mldlc
  GRAFANA_DATASOURCE_SSLMODE: disable
  GATEWAY_PUBLIC_URL: http://gateway.mldlc.local
  CORS_ALLOWED_ORIGIN_REGEX: ^https?://([a-z0-9-]+\.)?mldlc\.local(:\d+)?$
