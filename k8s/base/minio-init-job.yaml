apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: mldlc
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set myminio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb myminio/datasets --ignore-existing
              mc mb myminio/models --ignore-existing
              mc mb myminio/gitea-bucket --ignore-existing
              mc mb myminio/gitea-packages --ignore-existing
              mc event add myminio/datasets arn:minio:sqs::fastapi:webhook --event put || true
              mc event add myminio/models arn:minio:sqs::fastapi_models:webhook --event put || true
