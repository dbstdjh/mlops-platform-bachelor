apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: mldlc
spec:
  selector:
    app.kubernetes.io/name: edge-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: mldlc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
    spec:
      containers:
        - name: edge-gateway
          image: mldlc/edge-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret
          env:
            - name: LISTEN_ADDR
              value: :8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
