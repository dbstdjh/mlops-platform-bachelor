apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: mldlc
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: mldlc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:latest
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: db:5432
            - name: GITEA__database__NAME
              value: gitea
            - name: GITEA__database__USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_USER
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: POSTGRES_PASSWORD
            - name: GITEA__storage__STORAGE_TYPE
              value: minio
            - name: GITEA__storage__MINIO_ENDPOINT
              value: minio:9000
            - name: GITEA__storage__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ACCESS_KEY
            - name: GITEA__storage__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_SECRET_KEY
            - name: GITEA__storage__MINIO_BUCKET
              value: gitea-bucket
            - name: GITEA__storage__MINIO_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MINIO_REGION
            - name: GITEA__storage__MINIO_USE_SSL
              value: "false"
            - name: GITEA__packages__STORAGE_TYPE
              value: minio
            - name: GITEA__packages__MINIO_ENDPOINT
              value: minio:9000
            - name: GITEA__packages__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ACCESS_KEY
            - name: GITEA__packages__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_SECRET_KEY
            - name: GITEA__packages__MINIO_BUCKET
              value: gitea-packages
            - name: GITEA__packages__MINIO_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MINIO_REGION
            - name: GITEA__packages__MINIO_USE_SSL
              value: "false"
            - name: GITEA__server__ROOT_URL
              value: http://gitea.mldlc.local:80
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: gitea-data
              mountPath: /data
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: mldlc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
