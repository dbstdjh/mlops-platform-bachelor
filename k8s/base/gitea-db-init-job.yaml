apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-db-init
  namespace: mldlc
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: gitea-db-init
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h db -U mldlc -d postgres; do
                sleep 2
              done
              if ! psql -h db -U mldlc -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'gitea'" | grep -qx 1; then
                psql -v ON_ERROR_STOP=1 -h db -U mldlc -d postgres -c "CREATE DATABASE gitea OWNER mldlc"
              fi
