apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: mldlc
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h db -U mldlc -d mldlc; do
                sleep 2
              done
              psql -v ON_ERROR_STOP=1 -h db -U mldlc -d mldlc -f /schema/data-model.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: db-schema
