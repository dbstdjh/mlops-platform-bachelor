apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mldlc
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mldlc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_fastapi
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_fastapi
              value: http://api:8000/api/v1/datasets:confirm_upload
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_fastapi_models
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_fastapi_models
              value: http://api:8000/api/v1/models:confirm_upload
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: mldlc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
