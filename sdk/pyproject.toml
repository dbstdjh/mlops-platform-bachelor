[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mldlc-sdk"
version = "0.1.0"
description = "Sync-first Python SDK for the MLDLC control plane"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.13.3",
]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "email-validator>=2.0.0",
    "fastapi>=0.136.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "sqlalchemy[asyncio]>=2.0.49",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mldlc"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mldlc",
    "examples",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
