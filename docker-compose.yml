services:
  # PostgreSQL — Central database and message broker
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlops" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — S3-compatible object storage
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Webhook configuration for dataset upload notifications
      MINIO_NOTIFY_WEBHOOK_ENABLE_fastapi: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_fastapi: "http://api:8000/api/v1/datasets:confirm_upload"
      # Webhook configuration for model upload notifications
      MINIO_NOTIFY_WEBHOOK_ENABLE_fastapi_models: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_fastapi_models: "http://api:8000/api/v1/models:confirm_upload"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO Initialization — Creates buckets and configures webhooks
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " echo 'Configuring MinIO...';

      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;

      /usr/bin/mc mb myminio/datasets --ignore-existing; /usr/bin/mc mb myminio/models --ignore-existing;

      /usr/bin/mc event add myminio/datasets arn:minio:sqs::fastapi:webhook --event put || true; /usr/bin/mc event add myminio/models arn:minio:sqs::fastapi_models:webhook --event put || true;

      echo 'MinIO initialized successfully.'; exit 0; "

  # Gitea — Artifact registry with unified MinIO storage
  gitea:
    image: gitea/gitea:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3002:3000"
      - "2223:22"
    volumes:
      - gitea_data:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Database
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=mlops
      - GITEA__database__USER=mlops
      - GITEA__database__PASSWD=mlops
      # Unified Storage → MinIO
      - GITEA__storage__STORAGE_TYPE=minio
      - GITEA__storage__MINIO_ENDPOINT=minio:9000
      - GITEA__storage__MINIO_ACCESS_KEY_ID=minioadmin
      - GITEA__storage__MINIO_SECRET_ACCESS_KEY=minioadmin
      - GITEA__storage__MINIO_BUCKET=gitea-bucket
      - GITEA__storage__MINIO_LOCATION=us-east-1
      - GITEA__storage__MINIO_USE_SSL=false
      # Packages (Docker Registry) → MinIO
      - GITEA__packages__STORAGE_TYPE=minio
      - GITEA__packages__MINIO_ENDPOINT=minio:9000
      - GITEA__packages__MINIO_ACCESS_KEY_ID=minioadmin
      - GITEA__packages__MINIO_SECRET_ACCESS_KEY=minioadmin
      - GITEA__packages__MINIO_BUCKET=gitea-packages
      - GITEA__packages__MINIO_LOCATION=us-east-1
      - GITEA__packages__MINIO_USE_SSL=false
      # Server config
      - GITEA__server__ROOT_URL=http://localhost:3002
      - GITEA__service__DISABLE_REGISTRATION=true

  # Grafana — Embedded monitoring and plotting
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # PostgreSQL datasource will be provisioned via API at runtime

      # Control Plane API — FastAPI backend
  api:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mlops:mlops@db:5432/mlops
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_USE_SSL=false
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_TOKEN=${GITEA_ADMIN_TOKEN:-}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_PUBLIC_URL=http://localhost:3001
      - GRAFANA_ADMIN_TOKEN=${GRAFANA_ADMIN_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-super-secret-dev-key-change-in-prod}
    volumes:
      - ./control-plane/src:/app/src

volumes:
  postgres_data:
  minio_data:
  gitea_data:
  grafana_data:
